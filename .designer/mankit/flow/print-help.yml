apiVersion: core/design/v2
kind: Flow
metadata:
  id: print-help
  title: An app prints its help, or a usage mistake
spec:
  entry:
    method: EXEC
    path: /<app> help
  steps:
    - id: caller
      at: CMP-APP
      phase: caller
      label: "<app> help, <app> --help, or a wrong word or flag"
      note: The app called helpout.Apply(root, Info) when it built its cobra root, and runs it with helpout.Execute.
    - id: execute
      at: CMP-HELPOUT
      phase: execute
      label: Execute runs the root in the one help layout
      note: "Help prints what the app is, how to start it, its commands (hidden and deprecated left out), its flags and the repository. A usage mistake prints error: <msg> and the layout (or the verb's usage) to stderr."
    - id: answer
      at: CMP-APP
      phase: return
      label: "exit 0; 2 after a mistake; 3 refused; 1 with the error"
      note: A run-time error never shows the layout; it comes back untouched for the app to print with its own message and exit code.
