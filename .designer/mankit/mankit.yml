--- # block/CMP-EVENTS.yml
apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-EVENTS
  title: "events"
spec:
  place:
    group: GRP-CLI
  code:
    implements: events/events.go
  caption:
    - "live events: CloudEvents over SSE"
    - "GET /api/events, a switchable feature"
  description: |
    Attach puts it on the app's feature list, which must hold the events
    feature, with the product, the thing served, the event catalog and the
    event each change route causes; no handler calls it and no route names
    an event. As a serve.Part it refuses at start a cause that does not fit
    its route, adds GET /api/events, and hears of each change answered
    well: it builds the CloudEvent 1.0 (contracts event/v1, the request's
    traceparent, subject from the route's Changes.ID) and sends it to every
    open stream, keeping the last few. Server-Sent Events behind serve's
    guard, at most 64 streams, a heartbeat on an idle stream, Last-Event-ID
    resumes, and <product>.stream.gapped (contracts mankit/v1) for a
    client that missed events: too old, another server, the feature off
    meanwhile, or an event that could not be built. Off: 404 not_found,
    nothing kept, open streams end when the owner switches it off.
--- # block/CMP-QUEUE.yml
apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-QUEUE
  title: "queue"
spec:
  place:
    group: GRP-CLI
  code:
    implements: queue/queue.go
  caption:
    - "the change queue (ADR-S14)"
    - "one change at a time per served thing"
  description: |
    Change writes a ticket (contracts mankit/v1) at the end of the line in
    <served folder>/<app folder>/.queue/ (0700, ignores itself in git),
    waits until it is first and holds the turn, a file lock that holds
    across processes, runs the app's write, then its read-back. Tickets,
    never commands. A stale or unreadable ticket is moved to .queue/bad/,
    said and skipped. Codes: queue_timeout, not_read_back, ticket_lost,
    queue_unusable. List is what <app> queue shows.
