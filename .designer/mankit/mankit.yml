    - "Migrate, Current, CopyOnce"
  description: |
    Dir, Data, Product, ProductData and File name the org's folders (XDG,
    the same on Linux and macOS); a path and nothing more. Migrate copies
    an app's old files once from the system's config folder and leaves a
    mark; Current reads the old file until then; CopyOnce copies a file or
    folder only where nothing is. The folder name is the one constant
    home.Org.
