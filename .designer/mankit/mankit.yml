--- # block/CMP-ASK.yml
apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-ASK
  title: "ask"
spec:
  place:
    group: GRP-CLI
  code:
    implements: ask/ask.go
  caption:
    - "asks before a CLI verb changes anything"
    - "styles name, yes-no, never; --yes"
  description: |
    Every change has a type (create, edit, move, focus, archive, close,
    delete, settings, connect, run) and the user picks a style per type in
    the app's config.yaml (confirm: ...). Change asks in that style; with
    --yes it goes ahead; with no terminal on stdin and stderr it refuses
    (ErrRefused). A change to the system itself (System: true) still asks
    for the name. Load, Set and Remember read and write the confirm:
    section.
