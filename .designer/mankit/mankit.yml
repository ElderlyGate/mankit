--- # flow/pick-theme.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: pick-theme
  title: An app picks its colours at start
spec:
  entry:
    method: EXEC
    path: /<app> --theme <name>
  steps:
    - id: caller
      at: CMP-APP
      phase: caller
      label: The app starts, with or without --theme
    - id: resolve
      at: CMP-THEME
      phase: pre
      label: theme.Resolve(app, flag, set)
    - id: path
      at: CMP-CONFIGFILE
      phase: pre
      label: "configfile.Path: the app's config.yaml"
    - id: folder
      at: CMP-HOME
      phase: pre
      label: "home.File: <config folder>/<product id>/config.yaml"
      note: A path and nothing more; no file is made or copied, so starting the app changes nothing.
    - id: pick
      at: CMP-THEME
      phase: execute
      label: "--theme wins, then NO_COLOR (mono), then theme: and background:"
      note: "background: auto asks the terminal whether it is dark; each of the five palettes has a dark and a light variant."
    - id: answer
      at: CMP-APP
      phase: return
      label: "a Choice: the app builds its colours on theme.Base"
--- # flow/print-help.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: print-help
  title: An app prints its help, or a usage mistake
spec:
  entry:
    method: EXEC
    path: /<app> help
  steps:
    - id: caller
      at: CMP-APP
      phase: caller
      label: "<app> help, <app> --help, or a wrong word or flag"
      note: The app called helpout.Apply(root, Info) when it built its cobra root, and runs it with helpout.Execute.
    - id: execute
      at: CMP-HELPOUT
      phase: execute
      label: Execute runs the root in the one help layout
      note: "Help prints what the app is, how to start it, its commands (hidden and deprecated left out), its flags and the repository. A usage mistake prints error: <msg> and the layout (or the verb's usage) to stderr."
    - id: answer
      at: CMP-APP
      phase: return
      label: "exit 0; 2 after a mistake; 3 refused; 1 with the error"
      note: A run-time error never shows the layout; it comes back untouched for the app to print with its own message and exit code.
--- # flow/set-config.yml
apiVersion: core/design/v2
kind: Flow
metadata:
  id: set-config
  title: Somebody changes one setting from the command line
spec:
  entry:
    method: EXEC
    path: /<app> set config <key> <value>
  steps:
    - id: caller
      at: CMP-APP
      phase: caller
      label: "<app> set config theme nord"
      note: The app added settings/cli's get and set config, then prefs.AddTo, which wraps set config.
    - id: wrap
      at: CMP-PREFS
      phase: pre
      label: "set config asks first: Asker.Ask, type settings"
      note: A confirm.<type> key is checked against the app's types and the three styles here. --dry-run asks nothing and writes nothing.
    - id: ask
      at: CMP-ASK
      phase: pre
      label: "ask.Change: Proceed? [y/N/a] in the settings style"
      note: With --yes it goes ahead; with no terminal on stdin and stderr it is refused (ErrRefused, exit 3 through helpout); a no writes nothing.
    - id: yes
      at: CMP-PREFS
      phase: pre
      label: After the yes, the app's Migrate, then the original set config
      note: "Migrate (the app passes home.Migrate) copies the old files once, before anything is written; a remembered answer is saved as never."
    - id: verb
      at: CMP-SETTINGSCLI
      phase: execute
      label: settings/cli's set config runs
    - id: set
      at: CMP-SETTINGS
      phase: execute
      label: "settings.Set: value allowed? change only that key's line"
      note: A value the key does not allow is refused, naming the allowed ones; an empty value puts the key back to its default; a block, list, anchor or repeated key is refused, to be changed by hand.
    - id: write
      at: CMP-CONFIGFILE
      phase: execute
      label: "WriteFile: synced temp file, then rename"
      note: The real file behind a symlink is replaced and keeps its mode, so a crash leaves the old file or the new one, never half of it.
    - id: answer
      at: CMP-APP
      phase: return
      label: The key's new row is printed (table, json or yaml)
