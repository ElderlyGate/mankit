--- # design.yml
apiVersion: core/design/v2
kind: Design
metadata:
  id: mankit
  title: mankit, the Go library the org's apps share
spec:
  purpose: product
  description: |
    The current mankit, as the code on main has it: the Go packages the
    org's terminal apps and CLIs import, so a change is made once and
    reaches every app.

    Drawn from the repository: README.md, go.mod, the imports of every
    package, and .github/workflows/release.yml. Context is the technical
    context (which app imports it, what it reaches on the machine);
    Building Blocks are the packages and their imports; Runtime walks three
    things an app does with it; Deployment shows where it ends up: compiled
    into each app's binary.
  board:
    display:
      spacing:
        members: 4
        groups: 3
        components: 3
        tidy: 2
    links:
      calls:
        color: ink
        width: 1.4
        label: calls
        meaning: one package imports and calls another
      imports:
        color: accent
        width: 1.4
        label: imports
        meaning: an app or a developer takes mankit's packages into its Go module
      data:
        color: teal
        width: 1.4
        label: data
        meaning: files, clipboard text or a URL handed to something on the machine
      ships:
        color: violet
        width: 1.4
        label: ships
        meaning: a tagged version travels towards an app's build, or is compiled into its binary
--- # definitions.yml
apiVersion: core/system/v1
kind: Definitions
metadata:
  id: definitions
spec:
  vocabulary:
    link-label:
      - calls
      - imports
      - data
      - ships
      - related
  features:
    edges:
      label: edges
      requires:
        - Link
      type: check
      whenUndefined: invisible
      selectors:
        traverses:
          by: link-label
          values:
            - calls
            - imports
            - data
            - ships
        annotates:
          by: link-label
          values:
            - related
--- # block/CMP-APP.yml
