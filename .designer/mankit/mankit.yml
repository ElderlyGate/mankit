--- # block/CMP-SERVE.yml
apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-SERVE
  title: "serve"
spec:
  place:
    group: GRP-CLI
  code:
    implements: serve/handler.go
  caption:
    - "the server every app shares: guard,"
    - "contract, envelope, 428, servers"
  description: |
    App.Handler serves an app's routes behind the guard: this machine's
    address or a --host name, the page from its link (?token=) and a Strict
    cookie <app>-token-<port>, the token in X-<App>-Token, the page's own
    origin, JSON bodies. GET /api/version lists the contracts answered;
    Accept-Contract picks one, or 406
    unsupported_contract, and 428 for a change without confirm=yes unless the
    user picked never for its action type (confirm=remember saves that
    through Site.Remember). Every answer is the contracts
    envelope with ran (Write, WriteError; Answer, Failure and Encode for the
    CLI). App.Commands adds serve [--detach], servers, servers stop and
    servers link; every server, detached or not, leaves a record (contracts
    mankit/v1) in the app's data folder, and a server is known by asking
    its address without the token. Stopping tells a long answer, such as
    a stream, that the server is stopping. A switchable module is reached
    only through Site.Features: the serve.Part attached to a feature adds
    routes, served only while it is on, and hears of each change whose
    answer was good (Route.Changes names the thing), or that it missed one
    while off. StopOnShutdown does the same for an app's own http.Server.
--- # block/CMP-SETTINGS.yml
apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-SETTINGS
  title: "settings"
spec:
  place:
    group: GRP-CONFIG
  code:
    implements: settings/settings.go
  caption:
    - "every key of config.yaml"
    - "changes one key's line, nothing else"
  description: |
    Lists mankit's keys (theme, background, commands, confirm.<type>) and
    the app's own, with the value in the file or the default. Set refuses a
    value the key does not allow, puts a key back to its default on an
    empty value, and changes only that key's line; a confirm.<type> key
    goes to ask.Set.
