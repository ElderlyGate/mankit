    group: GRP-CONFIG
  code:
    implements: features/features.go
  caption:
    - "an app's switchable features"
    - "the owner's switch, then each closer"
  description: |
    New takes the app's features, the Store where the owner's switches are
    kept, and further closers (public mode, a license). States says which
    are on and, for one that is off, the first closer that closed it; Set
    switches one, and never opens what another closer closed; Known refuses
    an id the list does not hold. It knows no app and keeps no file itself.
