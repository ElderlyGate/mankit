apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-CTX-FILES
  title: The org's config and data folders
spec:
  place:
    views:
      - context
    group: GRP-CTX-MACHINE
  ui-design:
    look: soft
  caption:
    - "`~/.config/elderlygate/<product id>/`"
    - "`~/.local/share/elderlygate/<product id>/`"
  description: |
    Each app's files: `config.yaml`, `split`, `favorites` in its config
    folder, and its data folder (`home`). `$XDG_CONFIG_HOME` and
    `$XDG_DATA_HOME` move them; the same on Linux and macOS. `home.Migrate`
    copies the old files once from the system's config folder
    (`~/.config/<app>/` on Linux, `~/Library/Application Support/<app>/` on
    macOS).
  source:
    where:
      - README.md#where-the-files-are
      - home/home.go
