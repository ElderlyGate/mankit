apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-SETTINGSCLI
  title: "settings/cli"
spec:
  place:
    group: GRP-CLI
  code:
    implements: settings/cli/cli.go
  caption:
    - "<app> get config, <app> set config"
    - "-o table, json or yaml"
  description: |
    Adds get config (every key, its value and whether it is set or the
    default) and set config <key> <value> under the app's get and set.
    AddToE reports a clash with an existing config command or -o flag
    instead of working around it.
