apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-CTX-DEV
  title: App developer
spec:
  place:
    views:
      - context
    role: actor
  caption:
    - "`go get …/mankit@v0.x.y`"
    - "or a `go.work` beside the apps"
  description: |
    Builds an app on mankit. Releases mankit with a tag, then in each app
    runs `go get github.com/tugbayatilla/mankit@v0.x.y && go mod tidy`; while
    developing, a `go.work` in the folder above the repos points the apps at
    this checkout.
  source:
    where:
      - README.md#develop-alongside-the-apps
