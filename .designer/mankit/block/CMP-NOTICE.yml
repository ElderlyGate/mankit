apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-NOTICE
  title: "notice"
spec:
  place:
    group: GRP-TUI
  code:
    implements: notice/notice.go
  caption:
    - "the status line's latest message"
    - "first for a few seconds"
  description: |
    Puts the latest message first on the status line for a few seconds, so
    copied 2 lines shows even over a search or a running action.
