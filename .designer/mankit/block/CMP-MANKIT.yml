apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-MANKIT
  title: "**mankit**"
spec:
  place:
    views:
      - context
  ui-design:
    look: accent
  caption:
    - "Go module `github.com/tugbayatilla/mankit`"
    - "settings, help, asking, widgets, palette"
  description: |
    The Go library the org's apps share: a change here reaches every app
    instead of being made in each. No binary, no process of its own; it runs
    inside whichever app imports it.
  source:
    where:
      - README.md
      - go.mod
