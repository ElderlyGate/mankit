apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-APP
  title: An app
spec:
  place:
    role: actor
  caption:
    - "gitman, dcman, checkman, hubman,"
    - "control-room, kanban, designer"
  description: |
    Any app that imports mankit: it builds its cobra root and its TUI, and
    calls mankit's packages. Lines are drawn only to the packages the README
    shows an app calling directly (helpout, settings, settings/cli, prefs,
    theme, home); the TUI parts and desktop are imported too, by the -man
    apps, and are left without lines from here to keep the picture readable.
  source:
    where:
      - README.md
