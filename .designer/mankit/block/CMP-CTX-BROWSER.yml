apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-CTX-BROWSER
  title: Web browser
spec:
  place:
    views:
      - context
    group: GRP-CTX-MACHINE
  ui-design:
    look: soft
  caption:
    - "`open`, `wslview`, `xdg-open`"
  description: |
    `desktop.Open` opens a URL with `open` on macOS, `wslview` under WSL when
    it is installed, else `xdg-open`.
  source:
    where:
      - desktop/open.go
