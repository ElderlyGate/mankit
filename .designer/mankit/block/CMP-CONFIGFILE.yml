apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-CONFIGFILE
  title: "internal/configfile"
spec:
  place:
    group: GRP-CONFIG
  code:
    implements: internal/configfile/configfile.go
  caption:
    - "where config.yaml is, and writing it whole"
    - "temp file, sync, rename"
  description: |
    Path is the app's config.yaml (home.File unless a folder is given).
    WriteFile replaces the real file behind any symlink through a synced
    temp file and a rename, keeping its mode. Shared by ask, settings,
    theme and usercmd.
