apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-DEP-BUILD
  title: Each app's build
spec:
  place:
    views:
      - deployment
  caption:
    - "`go get …/mankit@v0.x.y && go mod tidy`"
    - "then the app's own release build"
  description: |
    Each app pins a mankit version in its go.mod and compiles it in with its
    own code. Where each app's release build runs (GitHub-hosted or a local
    runner) is the app's own deployment, not drawn here.
  source:
    where:
      - README.md#develop-alongside-the-apps
