apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-THEME
  title: "theme"
spec:
  place:
    group: GRP-CONFIG
  code:
    implements: theme/config.go
  caption:
    - "five palettes, dark and light, plus mono"
    - "--theme, NO_COLOR, then config.yaml"
  description: |
    The shared colours: default, nord, gruvbox, solarized, high-contrast,
    each with a dark- and a light-terminal variant, plus mono. Resolve
    picks one from --theme, then NO_COLOR, then theme: and background: in
    the app's config.yaml.
