apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-CTX-CLIP
  title: Terminal and clipboard
spec:
  place:
    views:
      - context
    group: GRP-CTX-MACHINE
  ui-design:
    look: soft
  caption:
    - "OSC 52, tmux, WSL `clip.exe`"
    - "`wl-copy`, `xclip`, `xsel`, `powershell.exe`"
  description: |
    Where copied text goes and pasted text comes from (`desktop`). Copy writes
    OSC 52 to the terminal (wrapped for tmux), then tries WSL `clip.exe` and
    the system tools; paste reads from `wl-paste`, `xclip`, `xsel` or
    `powershell.exe Get-Clipboard`. Tools are looked up only when copying or
    pasting, never at start.
  source:
    where:
      - desktop/clipboard.go
      - desktop/clipboard_unix.go
