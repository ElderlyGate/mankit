apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-SETTINGS
  title: "settings"
spec:
  place:
    group: GRP-CONFIG
  code:
    implements: settings/settings.go
  caption:
    - "every key of config.yaml"
    - "changes one key's line, nothing else"
  description: |
    Lists mankit's keys (theme, background, commands, confirm.<type>) and
    the app's own, with the value in the file or the default. Set refuses a
    value the key does not allow, puts a key back to its default on an
    empty value, and changes only that key's line; a confirm.<type> key
    goes to ask.Set.
