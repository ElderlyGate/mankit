apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-DEP-REPO
  title: "Repository ElderlyGate/mankit"
spec:
  place:
    views:
      - deployment
    group: GRP-DEP-GITHUB
  caption:
    - "a release tags `vX.Y.Z`, builds nothing"
    - "module path `github.com/tugbayatilla/mankit`"
  description: |
    The source. release.yml runs the org's release workflow on every push to
    main with `build: none`: a version tag and no binary, as a library has
    none. The module path stays github.com/tugbayatilla/mankit until a later
    migration moves it with the org rename (README).
  source:
    where:
      - .github/workflows/release.yml
      - README.md#develop-alongside-the-apps
