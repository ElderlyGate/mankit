apiVersion: core/design/v2
kind: Block
metadata:
  id: CMP-HELPOUT
  title: "helpout"
spec:
  place:
    group: GRP-CLI
  code:
    implements: helpout/helpout.go
  caption:
    - "one layout for help and --help"
    - "exit 0, 2 (mistake), 3 (refused), 1"
  description: |
    Apply sets the one help layout for <app> help, <app> --help and a usage
    mistake: what the app is, how to start it, its commands, its flags, the
    repository. Execute runs the root and turns a usage mistake into exit 2
    with the layout on stderr, an ask refusal (ask.ErrRefused) into exit 3,
    and returns any other run-time error untouched with exit 1.
