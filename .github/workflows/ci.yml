name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A public repo: GitHub's machines cost it nothing, and an own runner would run any fork's PR on the owner's Mac.
    name: github · linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, so gorelease finds the release tags it compares with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A PR that changes only cards, designs or Markdown skips the tests; the check still reports.
      - id: scope
        run: |
          files=$(git diff --name-only HEAD^1 HEAD) || files=all
          if printf '%s\n' "$files" | grep -qvE '^(\.kanban/|\.designer/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only cards, designs or Markdown changed: no tests."
          fi
      # Actions cache save hangs on our self-hosted runners; Go's module cache stays on the runner.
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: vet
        if: steps.scope.outputs.code == 'true'
        run: go vet ./...
      - name: gofmt
        if: steps.scope.outputs.code == 'true'
        run: test -z "$(gofmt -l .)"
      - name: test
        if: steps.scope.outputs.code == 'true'
        run: go test ./...
      # Two users on two machines share one served folder: the store refuses one the other's unfinished change (ADR-S22).
      - name: store, two users
        if: steps.scope.outputs.code == 'true'
        run: ./store/testdata/twouser.sh
      # A break in the public API fails, unless the module path moved to a new major (/vN): that is how a major is declared.
      - name: gorelease
        if: steps.scope.outputs.code == 'true'
        run: |
          go install golang.org/x/exp/cmd/gorelease@v0.0.0-20261109185158-a52e3aef5920
          mod=$(go list -m)
          major=v1
          case "${mod##*/}" in v[0-9]*) major=${mod##*/} ;; esac
          latest() { git tag -l "$1.*" | grep -E "^$1\.[0-9]+\.[0-9]+$" | sort -V | tail -n1; }
          base=$(latest "$major")
          if [ -n "$base" ]; then
            echo "Comparing with $base, the latest release of $major."
            gorelease -base="$base"
          else
            n=${major#v}
            prev=v$((n - 1))
            prevtag=$(latest "$prev")
            # The previous major's own go.mod names its path, which may differ from this one's beyond /vN.
            prevmod=$(git show "$prevtag:go.mod" | awk '$1 == "module" { print $2; exit }')
            echo "No $major release yet: comparing with $prevmod@$prevtag, as the first $major.0.0."
            gorelease -base="$prevmod@$prevtag" -version="$major.0.0"
          fi
