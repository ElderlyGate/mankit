name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: version files match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in VERSION; do
            [ -f "$f" ] || continue
            [ "$(tr -d '[:space:]' < "$f")" = "$tag" ] || { echo "$f differs from tag $GITHUB_REF_NAME"; exit 1; }
          done
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*) flag=--prerelease ;;
            *) flag= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --generate-notes $flag
