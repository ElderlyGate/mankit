name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rc:
        description: Make a release candidate vX.Y.Z-rc.N
        type: boolean
        default: false
      runner:
        description: Where this release runs; variable follows RELEASE_RUNNER (github when unset)
        type: choice
        options: [variable, local, github]
        default: variable

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ElderlyGate/.github/.github/workflows/release.yml@main
    with:
      build: none
      rc: ${{ inputs.rc == true }}
      runner: ${{ inputs.runner != 'variable' && inputs.runner || '' }}
